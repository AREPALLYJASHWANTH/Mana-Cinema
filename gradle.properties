#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Tue Oct 20 04:20:04 GMT 2026
android.nonTransitiveRClass=true
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
org.gradle.daemon=true
org.gradle.parallel=true
systemProp.java.net.preferIPv4Stack=true
org.gradle.jvmargs=-Xmx1536m -XX\:MaxMetaspaceSize\=512m -Dfile.encoding\=UTF-8
android.useAndroidX=true
systemProp.http.keepAlive=false
kotlin.code.style=official
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.configuration-cache=false
