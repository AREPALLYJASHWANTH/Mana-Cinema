name: Mana Cinema APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, for example v1.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mana-cinema-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.0.1 or v1.0.1-rc.1"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing Actions secret RELEASE_KEYSTORE_BASE64}"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mana-cinema-release.jks"
          test -s "$RUNNER_TEMP/mana-cinema-release.jks"

      - name: Run unit tests and build signed release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/mana-cinema-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FIREBASE_API_KEY:?Missing Actions secret FIREBASE_API_KEY}"
          : "${RELEASE_STORE_PASSWORD:?Missing Actions secret RELEASE_STORE_PASSWORD}"
          : "${RELEASE_KEY_ALIAS:?Missing Actions secret RELEASE_KEY_ALIAS}"
          : "${RELEASE_KEY_PASSWORD:?Missing Actions secret RELEASE_KEY_PASSWORD}"
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace --console=plain

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mana-cinema-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              app/build/outputs/apk/release/app-release.apk \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              app/build/outputs/apk/release/app-release.apk \
              --title "Mana Cinema $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
